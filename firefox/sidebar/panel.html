<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ticket Sidebar</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <h1>Ticket Sidebar</h1>
    <button id="follow-toggle" title="Toggle whether the sidebar follows your selection/cursor"></button>
  </header>

  <div id="paused-banner" hidden>
    Paused &mdash; the sidebar is not following your selection.
  </div>

  <div id="status"></div>

  <div id="alts" hidden></div>

  <main id="card">
    <div class="empty">
      <p>Select a Jira key (e.g. <code>ABC-1234</code>) or place the cursor on a
      GitHub/Jira link in a Google&nbsp;Docs document.</p>
      <p>Details will show up here automatically while <em>Follow</em> is on.</p>
    </div>
  </main>

  <footer>
    <form id="try-form">
      <input id="try-input" type="text" placeholder="Try a key or URL, e.g. ABC-1234" spellcheck="false">
      <button type="submit">Go</button>
    </form>
  </footer>

  <script src="../matcher.js"></script>
  <script src="panel.js"></script>
</body>
</html>
